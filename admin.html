<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Layer Studios — 예약 승인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Inter:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root {
      --cream: #FBF7ED; --paper: #FFFDF7; --ink: #383735; --black: #000; --muted: #63615D;
      --brown: #884813; --brown-soft: #F1E3D3; --line: #DDD9D1; --dark: #222223;
      --ok: #2E6B3F; --ok-soft: #E3EDE3; --warn: #A8641A; --warn-soft: #F6E9D3; --bad: #A33A2E; --bad-soft: #F5E0DC;
      --serif: "Source Serif 4", Georgia, serif; --sans: "Pretendard", "Inter", "Helvetica Neue", Arial, sans-serif; --label: "Inter", "Pretendard", sans-serif;
      --gutter: 32px; --header-h: 64px; --ease: cubic-bezier(.22,.61,.36,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; }
    a { color: inherit; text-decoration: none; } ul { list-style: none; margin: 0; padding: 0; } h1,h2,h3,p { margin: 0; font-weight: 400; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } textarea, input, select { font: inherit; color: inherit; }
    .label { font-family: var(--label); font-weight: 500; font-size: 11px; line-height: 16px; letter-spacing: 1px; text-transform: uppercase; }
    .label--muted { color: var(--muted); } .serif { font-family: var(--serif); }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 24px; background: var(--brown); color: #fff; font-family: var(--label); font-weight: 500; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; transition: background .3s var(--ease); white-space: nowrap; }
    .btn:hover { background: #6f3a0f; } .btn--ghost { background: none; color: var(--ink); border: 1px solid var(--line); } .btn--ghost:hover { background: #fff; }
    .btn--danger { background: none; color: var(--bad); border: 1px solid var(--bad); } .btn--danger:hover { background: var(--bad-soft); }
    .btn[disabled] { opacity: .4; cursor: default; }
    .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 2px; font-family: var(--label); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; }
    .chip--pending { background: var(--brown-soft); color: var(--brown); } .chip--hold { background: var(--warn-soft); color: var(--warn); }
    .chip--approved { background: var(--ok-soft); color: var(--ok); } .chip--rejected { background: var(--bad-soft); color: var(--bad); }
    .top { position: sticky; top: 0; z-index: 10; height: var(--header-h); background: var(--cream); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 var(--gutter); }
    .top__brand { display: flex; align-items: baseline; gap: 14px; }
    .top__wordmark { font-family: var(--serif); font-weight: 500; font-size: 17px; letter-spacing: 4px; text-transform: uppercase; color: var(--black); white-space: nowrap; }
    .top__nav { display: flex; gap: 28px; } .top__nav a { color: var(--muted); padding: 4px 0; border-bottom: 1px solid transparent; } .top__nav a.is-active { color: var(--black); border-color: currentColor; }
    .top__user { justify-self: end; display: flex; align-items: center; gap: 20px; color: var(--muted); } .top__user strong { font-weight: 500; color: var(--ink); }
    .wrap { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - var(--header-h)); }
    .queue { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .queue__head { padding: 24px var(--gutter) 0; } .queue__title { font-family: var(--serif); font-size: 22px; line-height: 28px; color: var(--black); }
    .queue__sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 20px; margin-top: 20px; border-bottom: 1px solid var(--line); }
    .tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 0 10px; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; }
    .tab.is-active { color: var(--black); border-color: var(--black); }
    .tab b { font-weight: 500; font-family: var(--label); font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--line); color: var(--ink); } .tab.is-active b { background: var(--black); color: #fff; }
    .queue__list { flex: 1; overflow-y: auto; }
    .req { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; padding: 16px var(--gutter); border-bottom: 1px solid var(--line); cursor: pointer; transition: background .2s var(--ease); }
    .req:hover { background: var(--paper); } .req.is-active { background: #fff; box-shadow: inset 3px 0 0 var(--brown); }
    .req__date { text-align: center; } .req__date b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 24px; color: var(--black); } .req__date span { display: block; font-size: 11px; color: var(--muted); }
    .req__studio { font-weight: 500; color: var(--black); } .req__meta { color: var(--muted); font-size: 13px; margin-top: 2px; } .req__who { font-size: 13px; margin-top: 4px; }
    .req__right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; } .req__ago { font-size: 11px; color: var(--muted); } .req__flag { color: var(--bad); font-size: 11px; font-weight: 500; }
    .queue__empty { padding: 48px var(--gutter); color: var(--muted); text-align: center; }
    .detail { padding: 24px var(--gutter) 64px; max-width: 1040px; }
    .detail__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .detail__title { font-family: var(--serif); font-size: 28px; line-height: 34px; color: var(--black); } .detail__title small { font-family: var(--sans); font-size: 14px; color: var(--muted); margin-left: 12px; }
    .detail__sub { margin-top: 6px; color: var(--muted); } .detail__actions { display: flex; gap: 10px; flex-shrink: 0; }
    .alert { display: flex; gap: 12px; align-items: flex-start; margin-top: 20px; padding: 14px 16px; border: 1px solid; border-radius: 2px; font-size: 13px; }
    .alert--bad { border-color: #E4B9B2; background: var(--bad-soft); color: var(--bad); } .alert--warn { border-color: #E5CFA8; background: var(--warn-soft); color: var(--warn); } .alert--ok { border-color: #BFD5C2; background: var(--ok-soft); color: var(--ok); }
    .alert svg { flex-shrink: 0; margin-top: 2px; }
    .section { margin-top: 32px; } .section__head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 24px; margin-top: 18px; }
    .fact dt { font-family: var(--label); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); } .fact dd { margin: 4px 0 0; font-size: 15px; color: var(--black); } .fact dd.serif { font-size: 18px; } .fact dd a { border-bottom: 1px solid var(--line); }
    .tl { margin-top: 18px; } .tl__hours { display: grid; grid-template-columns: 72px 1fr; } .tl__scale { position: relative; height: 18px; } .tl__scale span { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--label); font-size: 10px; color: var(--muted); }
    .tl__row { display: grid; grid-template-columns: 72px 1fr; align-items: center; border-top: 1px solid var(--line); } .tl__row:last-child { border-bottom: 1px solid var(--line); }
    .tl__part { padding: 12px 0; font-family: var(--serif); font-size: 15px; color: var(--black); } .tl__part small { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); }
    .tl__lane { position: relative; height: 64px; background: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / 14)); }
    .blk { position: absolute; top: 8px; height: 22px; display: flex; align-items: center; padding: 0 8px; font-size: 11px; white-space: nowrap; overflow: hidden; border-radius: 2px; }
    .blk--fixed { background: var(--dark); color: #fff; } .blk--prov { background: #fff; color: var(--brown); border: 1px dashed var(--brown); } .blk--other { background: var(--brown-soft); color: var(--brown); }
    .blk--this { top: 34px; background: var(--brown); color: #fff; box-shadow: 0 0 0 2px var(--cream), 0 0 0 3px var(--brown); } .blk--this.is-conflict { background: var(--bad); box-shadow: 0 0 0 2px var(--cream), 0 0 0 3px var(--bad); }
    .legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 12px; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; }
    .labels { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; } .lbl { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: 1px solid var(--line); background: #fff; font-size: 12px; } .lbl.is-prov { border-style: dashed; border-color: var(--brown); color: var(--brown); }
    .decision { margin-top: 32px; padding: 24px; background: var(--paper); border: 1px solid var(--line); } .decision__row { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
    .decision textarea { width: 100%; min-height: 72px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); resize: vertical; font-size: 13px; } .decision textarea:focus { outline: none; border-color: var(--ink); }
    .decision__hint { margin-top: 8px; font-size: 12px; color: var(--muted); } .decision__btns { display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
    .decision__label-as { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 14px; font-size: 13px; } .decision__label-as label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .decision__label-as input[type=text] { height: 30px; padding: 0 8px; border: 1px solid var(--line); background: #fff; width: 160px; }
    .log { margin-top: 14px; } .log li { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; } .log time { color: var(--muted); font-family: var(--label); font-size: 11px; letter-spacing: .5px; padding-top: 2px; }
    .note-form { display: flex; gap: 8px; margin-top: 12px; } .note-form input { flex: 1; height: 36px; padding: 0 10px; border: 1px solid var(--line); background: #fff; }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--dark); color: #fff; padding: 12px 20px; font-size: 13px; border-radius: 2px; opacity: 0; transition: all .3s var(--ease); pointer-events: none; z-index: 30; } .toast.is-on { opacity: 1; transform: translate(-50%, 0); } .toast.is-bad { background: var(--bad); }
    .edit { margin-top: 18px; display: grid; gap: 14px; } .edit[hidden] { display: none; }
    .edit__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; } .edit__wide { grid-column: 1 / -1; }
    .edit label { display: grid; gap: 4px; } .edit label > span { font-family: var(--label); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .edit input, .edit select, .edit textarea { height: 36px; padding: 0 10px; border: 1px solid var(--line); background: #fff; width: 100%; font-size: 13px; } .edit textarea { height: auto; min-height: 60px; padding: 8px 10px; resize: vertical; }
    .edit input:focus, .edit select:focus, .edit textarea:focus { outline: none; border-color: var(--ink); }
    .edit__row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; } .edit__hint { font-size: 12px; color: var(--muted); }
    .conf { border: 1px solid #E4B9B2; background: var(--bad-soft); padding: 14px 16px; font-size: 13px; color: var(--ink); } .conf[hidden] { display: none; } .conf > strong { color: var(--bad); }
    .conf__item { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; padding: 10px 0 4px; margin-top: 8px; border-top: 1px solid rgba(0,0,0,.08); }
    .conf__item > .label { grid-column: 1 / -1; } .conf__item label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; } .conf__item label > span { flex: 1; min-width: 0; } .conf__item input[type=radio] { width: auto; height: auto; margin: 3px 0 0; accent-color: var(--brown); }
    .conf__item code { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; background: #fff; padding: 6px 8px; border: 1px solid var(--line); margin-top: 4px; }
    @media (max-width: 1100px) { .edit__grid { grid-template-columns: repeat(2, 1fr); } .conf__item { grid-template-columns: 1fr; } }
    .empty { padding: 96px var(--gutter); text-align: center; color: var(--muted); }
    .gate { position: fixed; inset: 0; z-index: 50; background: var(--cream); display: flex; align-items: center; justify-content: center; padding: 24px; } .gate[hidden] { display: none; }
    .gate__box { width: 360px; max-width: 100%; } .gate__title { font-family: var(--serif); font-size: 24px; color: var(--black); margin-top: 16px; }
    .gate label { display: block; margin-top: 20px; } .gate input { display: block; width: 100%; height: 42px; margin-top: 6px; padding: 0 12px; border: 1px solid var(--line); background: #fff; } .gate input:focus { outline: none; border-color: var(--ink); }
    .gate .btn { width: 100%; margin-top: 24px; } .gate__err { margin-top: 12px; color: var(--bad); font-size: 13px; min-height: 18px; }
    @media (max-width: 1100px) { .facts { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 860px) { :root { --gutter: 20px; } .top { grid-template-columns: 1fr auto; } .top__nav, .top__brand .label { display: none; } .wrap { grid-template-columns: 1fr; } .queue { border-right: 0; border-bottom: 1px solid var(--line); max-height: 48vh; } .detail__head { flex-direction: column; } .decision__row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="gate" data-gate hidden>
    <form class="gate__box" data-gate-form>
      <div class="top__wordmark">Layer Studios</div>
      <h1 class="gate__title">예약 승인 콘솔</h1>
      <label><span class="label label--muted">이름</span><input type="text" name="actor" placeholder="처리 기록에 남을 이름" autocomplete="name" required></label>
      <label><span class="label label--muted">비밀번호</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">들어가기</button>
      <p class="gate__err" data-gate-err></p>
    </form>
  </div>

  <header class="top">
    <div class="top__brand"><a class="top__wordmark" href="mock-c6.html">Layer Studios</a><span class="label label--muted">Reservations · CS</span></div>
    <nav class="top__nav label"><a href="#" class="is-active">신청함</a><a href="https://schedule-nu-taupe.vercel.app/" target="_blank" rel="noopener">스케줄표 ↗</a></nav>
    <div class="top__user label"><span><strong data-actor>—</strong></span><button type="button" data-signout>Sign out</button></div>
  </header>

  <div class="wrap">
    <aside class="queue" aria-label="예약 신청 목록">
      <div class="queue__head">
        <h1 class="queue__title">예약 신청</h1>
        <p class="queue__sub">홈페이지로 들어온 신청. 승인하면 스케줄 게시판에 자동으로 올라갑니다.</p>
        <div class="tabs label" role="tablist" data-tabs>
          <button class="tab is-active" data-status="pending">대기 <b data-count="pending">0</b></button>
          <button class="tab" data-status="hold">보류 <b data-count="hold">0</b></button>
          <button class="tab" data-status="approved">승인 <b data-count="approved">0</b></button>
          <button class="tab" data-status="rejected">반려 <b data-count="rejected">0</b></button>
        </div>
      </div>
      <ul class="queue__list" data-list><li class="queue__empty">불러오는 중…</li></ul>
    </aside>
    <main class="detail" data-detail><div class="empty">왼쪽 목록에서 신청을 선택하세요.</div></main>
  </div>
  <div class="toast" data-toast></div>

  <script>
    const STUDIOS = { 'layer-41': ['A','B','C'], 'layer-20': ['1F','2F','3F','Caravan'], 'layer-11': ['A','B','Cafe'], 'layer-26': ['A','B'], 'layer-27': ['A','Office'], 'layer-7': ['A','B','C'], 'layer-10': ['A','B','C','D','E','Cafe'], 'layer-hannam': ['1F','2F'], 'hongdae': ['A','B','D','Back Garden','Greenhouse','Garden'], 'faust': ['Faust'], 'layer-57': ['1F','2F','3F','4F','5F'] };
    const NAMES = { 'layer-41': 'Layer 41', 'layer-20': 'Layer 20', 'layer-11': 'Layer 11', 'layer-26': 'Layer 26', 'layer-27': 'Layer 27', 'layer-7': 'Layer 7', 'layer-10': 'Layer 10', 'layer-hannam': 'Layer Hannam', 'hongdae': 'Hongdae', 'faust': 'Faust', 'layer-57': 'Layer 57' };
    const NO_BOARD = { 'layer-10': true, 'faust': true };
    const STATUS = { pending: '대기', hold: '보류', approved: '승인', rejected: '반려' };
    const HOURS = [8, 24];
    const $ = (s, el = document) => el.querySelector(s);
    const pad = n => String(n).padStart(2, '0');
    const dow = ['일','월','화','수','목','금','토'];
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const hrs = t => { const [h, m] = String(t).split(':').map(Number); return h + (m >= 30 ? .5 : 0); };
    const hm = h => pad(Math.floor(h)) + ':' + (h % 1 ? '30' : '00');
    const fmtDate = iso => { const d = new Date(iso + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${dow[d.getDay()]})`; };
    const fmtAt = iso => { const d = new Date(iso); return `${d.getMonth() + 1}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 60) return `${m}분 전`; const h = Math.round(m / 60); if (h < 48) return `${h}시간 전`; return `${Math.round(h / 24)}일 전`; };
    const pct = h => Math.max(0, Math.min(100, (h - HOURS[0]) / (HOURS[1] - HOURS[0]) * 100));
    const parts = r => String(r.part || '').split('+').filter(p => p && p !== '-');
    const overlap = (a, b) => a.start < b.end && a.end > b.start && a.parts.some(p => b.parts.includes(p));
    const icon = () => '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="6"/><path d="M7 4v3.5M7 9.6v.4"/></svg>';

    // ---------- auth ----------
    let PW = sessionStorage.getItem('layer_admin_pw') || '';
    let ACTOR = localStorage.getItem('layer_admin_actor') || '';
    async function api(action, { method = 'GET', query = {}, body } = {}) {
      const qs = new URLSearchParams({ action, ...query }).toString();
      const res = await fetch(`/api/admin?${qs}`, { method, headers: { 'x-admin-password': PW, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({ ok: false, error: 'bad-json' }));
      if (res.status === 401) { showGate('비밀번호가 맞지 않습니다.'); throw new Error('unauthorized'); }
      if (!res.ok || !data.ok) { const e = new Error(data.error || `HTTP ${res.status}`); e.data = data; throw e; }
      return data;
    }
    function showGate(msg) { $('[data-gate]').hidden = false; $('[data-gate-err]').textContent = msg || ''; const f = $('[data-gate-form]'); f.actor.value = ACTOR; f.password.focus(); }
    $('[data-gate-form]').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target; PW = f.password.value; ACTOR = f.actor.value.trim();
      try { await api('login'); sessionStorage.setItem('layer_admin_pw', PW); localStorage.setItem('layer_admin_actor', ACTOR); $('[data-gate]').hidden = true; $('[data-actor]').textContent = ACTOR; boot(); }
      catch (err) { if (err.message !== 'unauthorized') $('[data-gate-err]').textContent = '연결 오류: ' + err.message; }
    });
    $('[data-signout]').addEventListener('click', () => { sessionStorage.removeItem('layer_admin_pw'); PW = ''; showGate(''); });

    // ---------- queue ----------
    let tab = 'pending', current = null, rows = [];
    async function loadList() {
      const list = $('[data-list]');
      try {
        const d = await api('list', { query: { status: tab } }); rows = d.rows;
        for (const s of Object.keys(STATUS)) $(`[data-count="${s}"]`).textContent = d.counts[s] || 0;
      } catch (e) { if (e.message !== 'unauthorized') list.innerHTML = `<li class="queue__empty">불러오지 못했습니다: ${esc(e.message)}</li>`; return; }
      renderQueue();
    }
    function renderQueue() {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-active', t.dataset.status === tab));
      const list = $('[data-list]'); list.innerHTML = '';
      if (!rows.length) { list.innerHTML = `<li class="queue__empty">${STATUS[tab]} 건이 없습니다.</li>`; return; }
      rows.forEach(r => {
        const d = new Date(r.date + 'T00:00:00');
        const li = document.createElement('li'); li.className = 'req' + (current === r.id ? ' is-active' : '');
        li.innerHTML = `<div class="req__date"><b>${d.getDate()}</b><span>${d.getMonth() + 1}월 · ${dow[d.getDay()]}</span></div>

    function bindEdit(r) {

    const actionName = a => ({ submitted: '접수', approved: '승인', hold: '보류', rejected: '반려', pending: '대기로 되돌림', board_written: '게시판 기록', board_failed: '게시판 기록 실패', note: '메모', edited: '수정' }[a] || a);

      document.querySelectorAll('[data-act]').forEach(b => (b.disabled = true)); btn.textContent = '처리 중…';
      try {
        const d = await api('decide', { method: 'POST', body: { id: r.id, decision: act, note, label, fixedLabel, actor: ACTOR } });
        toast({ approved: d.board ? `승인했습니다. 게시판에 ${d.board.label} 글이 올라갔습니다.` : '승인했습니다. 게시판은 수기로 처리해 주세요.', hold: '보류로 옮겼습니다.', rejected: '반려했습니다.', pending: '대기로 되돌렸습니다.' }[act]);
        tab = act; await loadList(); loadDetail();
      } catch (e) {
        const msg = e.data && e.data.error === 'board-write' ? '게시판 글 작성에 실패해 승인하지 않았습니다. 잠시 후 다시 시도하거나 수기로 등록해 주세요.' : e.data && e.data.error === 'board-login' ? '게시판 로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.' : e.data && e.data.error === 'already-approved' ? '이미 승인된 건입니다.' : '처리 실패: ' + e.message;
        toast(msg, true); loadDetail();
      }
    }
    function toast(msg, bad) { const t = $('[data-toast]'); t.textContent = msg; t.classList.toggle('is-bad', !!bad); t.classList.add('is-on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('is-on'), bad ? 5000 : 2600); }

    async function boot() {
      $('[data-actor]').textContent = ACTOR || '—';
      const id = Number(new URLSearchParams(location.search).get('id'));
      await loadList();
      if (id) { current = id; renderQueue(); loadDetail(); }
    }
    (async () => {
      if (!PW || !ACTOR) return showGate('');
      try { await api('login'); boot(); } catch (e) { /* gate shown by api() */ }
    })();
  </script>
</body>
</html>
