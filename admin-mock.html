<html lang="ko">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Inter:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    /* =============================================================
       Layer Studios — reservation approval console (mock)
       Same tokens as mock-c6.html. Fake data only.
       ============================================================= */
    :root {
      --cream: #FBF7ED; --paper: #FFFDF7; --ink: #383735; --black: #000; --muted: #63615D;
      --brown: #884813; --brown-soft: #F1E3D3; --line: #DDD9D1; --dark: #222223;
      --ok: #2E6B3F; --ok-soft: #E3EDE3; --warn: #A8641A; --warn-soft: #F6E9D3; --bad: #A33A2E; --bad-soft: #F5E0DC;
      --serif: "Source Serif 4", Georgia, serif;
      --sans: "Pretendard", "Inter", "Helvetica Neue", Arial, sans-serif;
      --label: "Inter", "Pretendard", sans-serif;
      --gutter: 32px; --header-h: 64px; --ease: cubic-bezier(.22,.61,.36,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; }
    a { color: inherit; text-decoration: none; } ul { list-style: none; margin: 0; padding: 0; } h1,h2,h3,p { margin: 0; font-weight: 400; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    textarea, input { font: inherit; color: inherit; }
    .label { font-family: var(--label); font-weight: 500; font-size: 11px; line-height: 16px; letter-spacing: 1px; text-transform: uppercase; }
    .label--muted { color: var(--muted); }
    .serif { font-family: var(--serif); }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 24px; background: var(--brown); color: #fff; font-family: var(--label); font-weight: 500; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; transition: background .3s var(--ease); white-space: nowrap; }
    .btn:hover { background: #6f3a0f; }
    .btn--ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
    .btn--ghost:hover { background: #fff; }
    .btn--danger { background: none; color: var(--bad); border: 1px solid var(--bad); }
    .btn--danger:hover { background: var(--bad-soft); }
    .btn[disabled] { opacity: .4; cursor: default; }
    .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 2px; font-family: var(--label); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; }
    .chip--pending { background: var(--brown-soft); color: var(--brown); }
    .chip--hold { background: var(--warn-soft); color: var(--warn); }
    .chip--approved { background: var(--ok-soft); color: var(--ok); }
    .chip--rejected { background: var(--bad-soft); color: var(--bad); }

    /* ---- Top bar ---- */
    .top { position: sticky; top: 0; z-index: 10; height: var(--header-h); background: var(--cream); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 var(--gutter); }
    .top__brand { display: flex; align-items: baseline; gap: 14px; }
    .top__wordmark { font-family: var(--serif); font-weight: 500; font-size: 17px; letter-spacing: 4px; text-transform: uppercase; color: var(--black); white-space: nowrap; }
    .top__nav { display: flex; gap: 28px; }
    .top__nav a { color: var(--muted); padding: 4px 0; border-bottom: 1px solid transparent; }
    .top__nav a.is-active { color: var(--black); border-color: currentColor; }
    .top__user { justify-self: end; display: flex; align-items: center; gap: 20px; color: var(--muted); }
    .top__user strong { font-weight: 500; color: var(--ink); }

    /* ---- Layout ---- */
    .wrap { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - var(--header-h)); }
    .queue { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .queue__head { padding: 24px var(--gutter) 0; }
    .queue__title { font-family: var(--serif); font-size: 22px; line-height: 28px; color: var(--black); }
    .queue__sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 20px; margin-top: 20px; border-bottom: 1px solid var(--line); }
    .tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 0 10px; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; }
    .tab.is-active { color: var(--black); border-color: var(--black); }
    .tab b { font-weight: 500; font-family: var(--label); font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--line); color: var(--ink); }
    .tab.is-active b { background: var(--black); color: #fff; }
    .queue__list { flex: 1; overflow-y: auto; }
    .req { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; padding: 16px var(--gutter); border-bottom: 1px solid var(--line); cursor: pointer; transition: background .2s var(--ease); }
    .req:hover { background: var(--paper); }
    .req.is-active { background: #fff; box-shadow: inset 3px 0 0 var(--brown); }
    .req__date { text-align: center; }
    .req__date b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 24px; color: var(--black); }
    .req__date span { display: block; font-size: 11px; color: var(--muted); }
    .req__studio { font-weight: 500; color: var(--black); }
    .req__meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .req__who { font-size: 13px; margin-top: 4px; }
    .req__right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .req__ago { font-size: 11px; color: var(--muted); }
    .req__flag { color: var(--bad); font-size: 11px; font-weight: 500; }
    .queue__empty { padding: 48px var(--gutter); color: var(--muted); text-align: center; }

    /* ---- Detail ---- */
    .detail { padding: 24px var(--gutter) 64px; max-width: 1040px; }
    .detail__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .detail__title { font-family: var(--serif); font-size: 28px; line-height: 34px; color: var(--black); }
    .detail__title small { font-family: var(--sans); font-size: 14px; color: var(--muted); margin-left: 12px; }
    .detail__sub { margin-top: 6px; color: var(--muted); }
    .detail__actions { display: flex; gap: 10px; flex-shrink: 0; }
    .alert { display: flex; gap: 12px; align-items: flex-start; margin-top: 20px; padding: 14px 16px; border: 1px solid; border-radius: 2px; font-size: 13px; }
    .alert--bad { border-color: #E4B9B2; background: var(--bad-soft); color: var(--bad); }
    .alert--warn { border-color: #E5CFA8; background: var(--warn-soft); color: var(--warn); }
    .alert--ok { border-color: #BFD5C2; background: var(--ok-soft); color: var(--ok); }
    .alert svg { flex-shrink: 0; margin-top: 2px; }
    .alert[hidden] { display: none; }
    .section { margin-top: 32px; }
    .section__head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 24px; margin-top: 18px; }
    .fact dt { font-family: var(--label); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .fact dd { margin: 4px 0 0; font-size: 15px; color: var(--black); }
    .fact dd.serif { font-size: 18px; }
    .fact--wide { grid-column: span 2; }
    .fact dd a { border-bottom: 1px solid var(--line); }

    /* ---- Timeline ---- */
    .tl { margin-top: 18px; }
    .tl__hours { display: grid; grid-template-columns: 72px 1fr; }
    .tl__scale { position: relative; height: 18px; }
    .tl__scale span { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--label); font-size: 10px; color: var(--muted); }
    .tl__row { display: grid; grid-template-columns: 72px 1fr; align-items: center; border-top: 1px solid var(--line); }
    .tl__row:last-child { border-bottom: 1px solid var(--line); }
    .tl__part { padding: 12px 0; font-family: var(--serif); font-size: 15px; color: var(--black); }
    .tl__part small { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); }
    .tl__lane { position: relative; height: 64px; background: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / 14)); }
    .blk { position: absolute; top: 8px; height: 22px; display: flex; align-items: center; padding: 0 8px; font-size: 11px; white-space: nowrap; overflow: hidden; border-radius: 2px; }
    .blk--fixed { background: var(--dark); color: #fff; }
    .blk--prov { background: #fff; color: var(--brown); border: 1px dashed var(--brown); }
    .blk--this { top: 34px; background: var(--brown); color: #fff; box-shadow: 0 0 0 2px var(--cream), 0 0 0 3px var(--brown); }
    .blk--this.is-conflict { background: var(--bad); box-shadow: 0 0 0 2px var(--cream), 0 0 0 3px var(--bad); }
    .legend { display: flex; gap: 20px; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; }

    /* ---- Board posts ---- */
    .posts { margin-top: 12px; }
    .post { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .post__label { font-family: var(--label); font-size: 11px; color: var(--black); }
    .post__label.is-prov { color: var(--brown); }
    .post__body { color: var(--ink); }
    .post__body small { display: block; color: var(--muted); }
    .post__meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

    /* ---- Decision ---- */
    .decision { margin-top: 32px; padding: 24px; background: var(--paper); border: 1px solid var(--line); }
    .decision__row { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
    .decision textarea { width: 100%; min-height: 72px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); resize: vertical; font-size: 13px; }
    .decision textarea:focus { outline: none; border-color: var(--ink); }
    .decision__hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .decision__btns { display: flex; flex-direction: column; gap: 8px; min-width: 180px; }
    .decision__label-as { display: flex; gap: 16px; margin-top: 14px; font-size: 13px; }
    .decision__label-as label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

    /* ---- Log ---- */
    .log { margin-top: 14px; }
    .log li { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .log time { color: var(--muted); font-family: var(--label); font-size: 11px; letter-spacing: .5px; padding-top: 2px; }

    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--dark); color: #fff; padding: 12px 20px; font-size: 13px; border-radius: 2px; opacity: 0; transition: all .3s var(--ease); pointer-events: none; }
    .toast.is-on { opacity: 1; transform: translate(-50%, 0); }
    .empty { padding: 96px var(--gutter); text-align: center; color: var(--muted); }

    @media (max-width: 1100px) { .facts { grid-template-columns: repeat(2, 1fr); } .fact--wide { grid-column: span 2; } }
    @media (max-width: 860px) {
      :root { --gutter: 20px; }
      .top { grid-template-columns: 1fr auto; } .top__nav { display: none; } .top__brand .label, .top__user span { display: none; }
      .wrap { grid-template-columns: 1fr; }
      .queue { border-right: 0; border-bottom: 1px solid var(--line); max-height: 48vh; }
      .detail__head { flex-direction: column; } .decision__row { grid-template-columns: 1fr; }
    }
  </style>
</head>

      { id: 'R-1036', studio: 'hannam', part: '1F', date: '2026-10-20', start: 9, end: 18, purpose: '사진 촬영', people: 10, cars: 2, name: '한소희', phone: '010-4444-9999', email: 'sohee@orr.kr', company: 'ORR', memo: '', at: '2026-09-26T10:00:00', status: 'hold', log: [{ at: '2026-09-26T10:00:00', text: '홈페이지에서 신청 접수' }, { at: '2026-09-26T14:10:00', text: '보류 · 김민지 — 같은 날 ORR 확정 건과 동일 고객, 중복 여부 확인 중' }] },
      { id: 'R-1035', studio: 'layer-41', part: 'B', date: '2026-10-09', start: 9, end: 18, purpose: '영상 촬영', people: 15, cars: 2, name: '윤재호', phone: '010-6666-0000', email: 'jaeho@ad.kr', company: '애드에이전시', memo: '', at: '2026-09-25T13:00:00', status: 'approved', log: [{ at: '2026-09-25T13:00:00', text: '홈페이지에서 신청 접수' }, { at: '2026-09-25T13:40:00', text: '승인 · 김민지 — 게시판 글 #48213 작성, 라벨 ++(W1)' }] },
      { id: 'R-1034', studio: 'layer-20', part: '2F', date: '2026-10-05', start: 18, end: 23, purpose: '행사', people: 60, cars: 6, name: '강민수', phone: '010-8888-7777', email: 'minsu@party.kr', company: '', memo: '', at: '2026-09-24T22:10:00', status: 'rejected', log: [{ at: '2026-09-24T22:10:00', text: '홈페이지에서 신청 접수' }, { at: '2026-09-25T09:05:00', text: '반려 · 박준영 — 야간 행사 불가 안내, 전화 완료' }] },
    ];

    // ---------- helpers ----------
    const $ = (s, el = document) => el.querySelector(s);
    const pad = n => String(n).padStart(2, '0');
    const hm = h => pad(Math.floor(h)) + ':' + (h % 1 ? '30' : '00');
    const dow = ['일', '월', '화', '수', '목', '금', '토'];
    const fmtDate = iso => { const d = new Date(iso + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${dow[d.getDay()]})`; };
    const fmtAt = iso => { const d = new Date(iso); return `${d.getMonth() + 1}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 60) return `${m}분 전`; const h = Math.round(m / 60); if (h < 48) return `${h}시간 전`; return `${Math.round(h / 24)}일 전`; };
    const STATUS = { pending: '대기', hold: '보류', approved: '승인', rejected: '반려' };
    const HOURS = [8, 22];
    const pct = h => ((h - HOURS[0]) / (HOURS[1] - HOURS[0]) * 100);
    const boardOf = r => BOARD[`${r.studio}|${r.date}`] || [];
    const conflicts = r => boardOf(r).filter(b => b.part === r.part && b.start < r.end && b.end > r.start);
    const provCount = r => boardOf(r).filter(b => !b.fixed).length;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let tab = 'pending', current = null;

    // ---------- queue ----------
    function renderQueue() {
      ['pending', 'hold', 'approved', 'rejected'].forEach(s => { $(`[data-count="${s}"]`).textContent = REQUESTS.filter(r => r.status === s).length; });
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-active', t.dataset.status === tab));
      const list = $('[data-list]'); list.innerHTML = '';
      const items = REQUESTS.filter(r => r.status === tab).sort((a, b) => b.at.localeCompare(a.at));
      if (!items.length) { list.innerHTML = `<li class="queue__empty">${STATUS[tab]} 건이 없습니다.</li>`; return; }
      items.forEach(r => {
        const s = STUDIOS[r.studio]; const d = new Date(r.date + 'T00:00:00'); const c = conflicts(r).length;
        const li = document.createElement('li'); li.className = 'req' + (current === r.id ? ' is-active' : '');
        li.innerHTML = `
          <div class="req__date"><b>${d.getDate()}</b><span>${d.getMonth() + 1}월 · ${dow[d.getDay()]}</span></div>
          <div>
            <div class="req__studio">${s.name} · ${r.part}</div>
            <div class="req__meta">${hm(r.start)}–${hm(r.end)} · ${r.purpose} · ${r.people}명</div>
            <div class="req__who">${esc(r.name)}${r.company ? ' · ' + esc(r.company) : ''}</div>
          </div>
          <div class="req__right">
            <span class="req__ago">${ago(r.at)}</span>
            ${c && r.status === 'pending' ? '<span class="req__flag">시간 겹침</span>' : ''}
            ${!s.board ? '<span class="label label--muted" style="font-size:9px">게시판 없음</span>' : ''}
          </div>`;
        li.addEventListener('click', () => { current = r.id; renderQueue(); renderDetail(); });
        list.appendChild(li);
      });
    }

    // ---------- detail ----------
    function renderDetail() {
      const root = $('[data-detail]');
      const r = REQUESTS.find(x => x.id === current);
      if (!r) { root.innerHTML = '<div class="empty">왼쪽 목록에서 신청을 선택하세요.</div>'; return; }
      const s = STUDIOS[r.studio]; const posts = boardOf(r); const cf = conflicts(r); const rank = provCount(r) + 1;
      const done = r.status === 'approved' || r.status === 'rejected';

      const alert = cf.length
        ? `<div class="alert alert--bad">${icon()}<div><strong>같은 파트에 시간이 겹치는 예약이 있습니다.</strong> ${cf.map(b => `${b.part} ${hm(b.start)}–${hm(b.end)} ${esc(b.label)}${b.fixed ? ' (확정)' : ' (가부킹)'}`).join(', ')}. 승인 전에 고객과 시간 조정이 필요합니다.</div></div>`
        : !s.board
        ? `<div class="alert alert--warn">${icon()}<div><strong>${s.name}은 스케줄 게시판이 없는 지점입니다.</strong> 승인해도 자동으로 올라가지 않으니 수기로 처리하고 여기서 상태만 바꿔 주세요.</div></div>`
        : `<div class="alert alert--ok">${icon()}<div><strong>겹치는 예약이 없습니다.</strong> 승인하면 ${fmtDate(r.date)} 게시판에 <b>++(W${rank})</b> 가부킹 글이 올라갑니다.</div></div>`;

      const lanes = s.parts.map(p => {
        const blocks = posts.filter(b => b.part === p).map(b => `<div class="blk ${b.fixed ? 'blk--fixed' : 'blk--prov'}" style="left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%" title="${esc(b.memo)}">${esc(b.label)} ${hm(b.start)}–${hm(b.end)}</div>`).join('');
        const mine = p === r.part ? `<div class="blk blk--this ${cf.length ? 'is-conflict' : ''}" style="left:${pct(r.start)}%;width:${pct(r.end) - pct(r.start)}%;top:${posts.some(b => b.part === p) ? '34px' : '8px'}">이 신청 ${hm(r.start)}–${hm(r.end)}</div>` : '';
        return `<div class="tl__row"><div class="tl__part">${p}<small>${posts.filter(b => b.part === p).length ? posts.filter(b => b.part === p).length + '건' : '비어 있음'}</small></div><div class="tl__lane">${blocks}${mine}</div></div>`;
      }).join('');
      const scale = []; for (let h = HOURS[0]; h <= HOURS[1]; h += 2) scale.push(`<span style="left:${pct(h)}%">${pad(h)}</span>`);

      root.innerHTML = `
        <div class="detail__head">
          <div>
            <h2 class="detail__title">${s.name} · ${r.part}<small>${r.id}</small></h2>
            <p class="detail__sub">${fmtDate(r.date)} · ${hm(r.start)}–${hm(r.end)} · ${r.purpose} · <span class="chip chip--${r.status}">${STATUS[r.status]}</span></p>
          </div>
          <div class="detail__actions">
            <a class="btn btn--ghost" href="tel:${r.phone.replace(/-/g, '')}">전화</a>
            <a class="btn btn--ghost" href="mailto:${r.email}">메일</a>
          </div>
        </div>
        ${alert}

        <section class="section">
          <div class="section__head"><h3 class="label">신청 내용</h3><span class="label label--muted">접수 ${fmtAt(r.at)}</span></div>
          <dl class="facts">
            <div class="fact"><dt>지점 · 파트</dt><dd class="serif">${s.name} · ${r.part}</dd></div>
            <div class="fact"><dt>날짜</dt><dd class="serif">${fmtDate(r.date)}</dd></div>
            <div class="fact"><dt>시간</dt><dd class="serif">${hm(r.start)} – ${hm(r.end)}</dd></div>
            <div class="fact"><dt>내용</dt><dd class="serif">${r.purpose}</dd></div>
            <div class="fact"><dt>인원 · 차량</dt><dd>${r.people}명 · ${r.cars}대</dd></div>
            <div class="fact"><dt>신청자</dt><dd>${esc(r.name)}${r.company ? ' · ' + esc(r.company) : ''}</dd></div>
            <div class="fact"><dt>연락처</dt><dd><a href="tel:${r.phone}">${r.phone}</a><br><a href="mailto:${r.email}">${r.email}</a></dd></div>
            <div class="fact"><dt>이전 이용</dt><dd>${r.name === '한소희' ? '3회 · 최근 2026.06 Layer Hannam' : '없음 (신규)'}</dd></div>
            <div class="fact fact--wide" style="grid-column: 1 / -1"><dt>요청 사항</dt><dd>${r.memo ? esc(r.memo) : '<span style="color:var(--muted)">없음</span>'}</dd></div>
          </dl>
        </section>

        <section class="section">
          <div class="section__head"><h3 class="label">${fmtDate(r.date)} · ${s.name} 스케줄</h3><a class="label label--muted" href="#">게시판에서 열기 →</a></div>
          <div class="tl">
            <div class="tl__hours"><div></div><div class="tl__scale">${scale.join('')}</div></div>
            ${lanes}
          </div>
          <div class="legend"><span><i style="background:var(--dark)"></i>확정</span><span><i style="border:1px dashed var(--brown);background:#fff"></i>가부킹 (++)</span><span><i style="background:var(--brown)"></i>이 신청</span><span><i style="background:var(--bad)"></i>겹침</span></div>
          <div class="posts">
            ${posts.length ? posts.map(b => `<div class="post"><span class="post__label ${b.fixed ? '' : 'is-prov'}">${esc(b.label)}</span><span class="post__body">${b.part} · ${hm(b.start)}–${hm(b.end)}<small>${esc(b.memo)}</small></span><span class="post__meta">${b.fixed ? '확정' : '가부킹'}</span></div>`).join('') : '<p style="padding:14px 0;color:var(--muted);font-size:13px">이날 게시판에 올라온 글이 없습니다.</p>'}
          </div>
        </section>

        <section class="decision" ${done ? 'hidden' : ''}>
          <div class="decision__row">
            <div>
              <label class="label label--muted" for="note">메모 · 반려 사유</label>
              <textarea id="note" placeholder="고객에게 안내한 내용이나 반려 사유를 적어 두세요. 로그에 남습니다."></textarea>
              <div class="decision__label-as label--muted" style="font-size:13px">
                <span class="label label--muted" style="align-self:center">게시판 라벨</span>
                <label><input type="radio" name="lbl" value="prov" checked> ++(W${rank}) 가부킹</label>
                <label><input type="radio" name="lbl" value="fixed"> 확정 (입금 확인됨)</label>
              </div>
              <p class="decision__hint">승인하면 게시판 글이 자동으로 작성되고 이 건은 승인 탭으로 이동합니다. 되돌리려면 게시판에서 직접 지워야 합니다.</p>
            </div>
            <div class="decision__btns">
              <button class="btn" data-act="approved" ${cf.length ? 'disabled title="시간 겹침을 먼저 해결하세요"' : ''}>${s.board ? '승인 · 게시판 작성' : '승인 · 수기 처리'}</button>
              <button class="btn btn--ghost" data-act="hold">보류</button>
              <button class="btn btn--danger" data-act="rejected">반려</button>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section__head"><h3 class="label">처리 기록</h3></div>
          <ul class="log">${r.log.slice().reverse().map(l => `<li><time>${fmtAt(l.at)}</time><span>${esc(l.text)}</span></li>`).join('')}</ul>
        </section>`;

      root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => decide(r, b.dataset.act)));
    }

    function decide(r, act) {
      const note = $('#note').value.trim(); const lbl = $('input[name="lbl"]:checked').value;
      const s = STUDIOS[r.studio]; const now = new Date().toISOString();
      let text;
      if (act === 'approved') text = s.board ? `승인 · 김민지 — 게시판 글 #${48200 + Math.floor(Math.random() * 90)} 작성, 라벨 ${lbl === 'prov' ? '++(W' + (provCount(r) + 1) + ')' : '확정'}` : '승인 · 김민지 — 게시판 없는 지점, 수기 처리';
      if (act === 'hold') text = '보류 · 김민지';
      if (act === 'rejected') text = '반려 · 김민지';
      if (note) text += ' — ' + note;
      r.status = act; r.log.push({ at: now, text });
      if (act === 'approved' && s.board && lbl === 'prov') boardOf(r).push({ label: `++(W${provCount(r) + 1})`, part: r.part, start: r.start, end: r.end, memo: `홈페이지 예약 신청 · ${r.name}`, fixed: false });
      if (act === 'approved' && s.board && lbl === 'fixed') boardOf(r).push({ label: r.company || r.name, part: r.part, start: r.start, end: r.end, memo: `홈페이지 예약 · ${r.name}`, fixed: true });
      toast({ approved: s.board ? '승인했습니다. 게시판에 글이 올라갔습니다.' : '승인했습니다. 게시판은 수기로 처리해 주세요.', hold: '보류로 옮겼습니다.', rejected: '반려했습니다.' }[act]);
      tab = act; renderQueue(); renderDetail();
    }

    function toast(msg) { const t = $('[data-toast]'); t.textContent = msg; t.classList.add('is-on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('is-on'), 2600); }
    function icon() { return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="6"/><path d="M7 4v3.5M7 9.6v.4"/></svg>'; }

    $('[data-tabs]').addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; tab = t.dataset.status; current = null; renderQueue(); renderDetail(); });
    renderQueue(); current = 'R-1042'; renderQueue(); renderDetail();
  </script>
</body>
</html>
